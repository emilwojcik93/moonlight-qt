# Tests and lints the automation itself.  No secrets, read-only token, no pull_request_target.
name: Automation self-test

on:
  push:
    branches: [automation, automation-ci]
    paths:
      - 'ci/**'
      - '.github/**'
      - 'docs/CI.md'
  pull_request:
    paths:
      - 'ci/**'
      - '.github/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest, actionlint, zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pytest
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install -q pytest==9.2.0
          .venv/bin/python -m pytest ci/tests -q
      - name: actionlint (pinned, checksum verified)
        run: |
          set -euo pipefail
          v=1.7.12
          curl -sSfL -o al.tgz "https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  al.tgz" | sha256sum -c -
          tar -xzf al.tgz actionlint
          ./actionlint -color -ignore 'could not read reusable workflow file for "./.github/workflows/build-win-mac.yml"' .github/workflows/*.yml ci/wrapper/patched-windows-release.yml
      - name: zizmor
        run: |
          set -euo pipefail
          .venv/bin/pip install -q zizmor==1.32.0
          .venv/bin/zizmor --no-progress --min-severity medium .github/workflows ci/wrapper
