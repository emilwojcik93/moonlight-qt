# Policy for the moonlight-qt patch pipeline (CONTRACT.md v1.1 section 5).
# Consumers parse this file strictly and fail closed on a missing
# allow_upstream_owners or deny. Do not add keys; extensions use an "x-" prefix.
schema: 1
allow_upstream_owners: [Nonary]
cooling_off_hours: {stable: 24, canary: 0}
hold: false
deny: []
keep_releases: 10
# Extension (ignored by consumers): oldest upstream tag the series applies to,
# used as the default --floor of tools/rot-matrix.sh.
x-supported_floor_tag: v6.2.0-daily.201
